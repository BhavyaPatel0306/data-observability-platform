name: Bug report
description: Report a reproducible problem with the demo
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: Include OS, Kubernetes version, and relevant logs. Remove credentials and personal data.
