apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: data-observability
type: Opaque
stringData:
  POSTGRES_USER: demo
  POSTGRES_PASSWORD: local-demo-only-change-me
  POSTGRES_DB: observability
