apiVersion: v1
kind: List
items:
- apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: prometheus
    namespace: data-observability
- apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata:
    name: prometheus
    namespace: data-observability
  rules:
  - apiGroups:
    - ''
    resources:
    - pods
    verbs:
    - get
    - list
    - watch
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: prometheus
    namespace: data-observability
  subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: data-observability
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: prometheus
