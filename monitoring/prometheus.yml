global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
- /etc/prometheus/alerts.yml
scrape_configs:
- job_name: ingest-api
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - data-observability
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_app
    regex: api
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_container_port_number
    regex: '8000'
    action: keep
