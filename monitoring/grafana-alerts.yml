apiVersion: 1
groups:
- orgId: 1
  name: ingestion-health
  folder: Data Observability
  interval: 1m
  rules:
  - uid: ingestion-database-errors
    title: Ingestion database errors
    condition: C
    for: 1m
    noDataState: NoData
    execErrState: Error
    annotations:
      summary: Persistence errors occurred within the last five minutes
    labels:
      severity: critical
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum(increase(dop_events_total{outcome="db_error"}[5m]))
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
